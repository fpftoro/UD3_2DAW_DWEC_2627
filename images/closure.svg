<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Un closure: la función interna y su entorno</title>
  <desc id="d">A la izquierda, la llamada crearContador() termina y devuelve una función. A la derecha, la función devuelta, incrementar, aparece dentro de una mochila que contiene su entorno léxico con la variable cuenta. Cada llamada a incrementar lee y modifica cuenta dentro de la mochila.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Llamada a la función externa -->
    <rect x="20" y="20" width="360" height="270" rx="14" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="40" y="52" font-size="19" font-weight="700" fill="#1864ab">1. Se ejecuta crearContador()</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#1864ab">
      <text x="40" y="90">function crearContador() {</text>
      <text x="60" y="118">let cuenta = 0;</text>
      <text x="60" y="146">return function incrementar() {</text>
      <text x="80" y="174">cuenta++;</text>
      <text x="80" y="202">return cuenta;</text>
      <text x="60" y="230">};</text>
      <text x="40" y="258">}</text>
    </g>

    <!-- Flecha de devolución -->
    <path d="M385 150 C 430 150, 440 150, 480 150" stroke="#d9480f" stroke-width="3" fill="none" marker-end="url(#flecha)"/>
    <text x="392" y="138" font-size="15" fill="#d9480f">devuelve</text>

    <!-- Closure: función + entorno -->
    <rect x="490" y="20" width="390" height="270" rx="14" fill="#fff9db" stroke="#f08c00" stroke-width="3"/>
    <text x="510" y="52" font-size="19" font-weight="700" fill="#e67700">2. Closure = función + su entorno</text>
    <rect x="515" y="72" width="340" height="70" rx="10" fill="#ffffff" stroke="#f08c00" stroke-width="2"/>
    <text x="535" y="102" font-size="16" font-weight="700" fill="#e67700">Función incrementar</text>
    <text x="535" y="128" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e67700">cuenta++; return cuenta;</text>
    <rect x="515" y="160" width="340" height="110" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="535" y="190" font-size="16" font-weight="700" fill="#2b8a3e">Entorno léxico guardado («mochila»)</text>
    <text x="535" y="222" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#2b8a3e">cuenta: 0 → 1 → 2</text>
    <text x="535" y="252" font-size="14" fill="#2b8a3e">Sigue vivo aunque crearContador() ya terminó</text>

    <!-- Uso -->
    <rect x="20" y="320" width="860" height="130" rx="14" fill="#fff0f6" stroke="#c2255c" stroke-width="3"/>
    <text x="40" y="352" font-size="19" font-weight="700" fill="#a61e4d">3. Uso</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#a61e4d">
      <text x="40" y="384">const siguiente = crearContador();</text>
      <text x="40" y="412">siguiente(); // 1</text>
      <text x="40" y="436">siguiente(); // 2</text>
      <text x="470" y="384">// Nadie más puede tocar «cuenta»:</text>
      <text x="470" y="412">console.log(cuenta);</text>
      <text x="470" y="436">// ❌ ReferenceError</text>
    </g>
  </g>
</svg>
